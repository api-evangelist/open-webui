apis:
- aid: open-webui:platform
  name: Open WebUI API
  description: >-
    REST API exposed by a self-hosted Open WebUI instance. Endpoints cover chat completions (proxying
    upstream backends like Ollama or OpenAI-compatible servers), models, prompts, knowledge bases, files,
    RAG, users, auth, and tools. Authentication uses the Open WebUI session token or per-user API keys.
    The base URL is wherever you deploy Open WebUI (commonly http://localhost:3000/api/v1).
  humanURL: https://docs.openwebui.com/getting-started/api-endpoints
  baseURL: http://localhost:3000/api/v1
